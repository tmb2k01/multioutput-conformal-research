[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multioutput-conformal-research"
version = "0.2.0"
description = "Controlled synthetic predictions for multi-output conformal research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.9"]
plots = ["matplotlib>=3.6,<4"]

[project.scripts]
mocp = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
