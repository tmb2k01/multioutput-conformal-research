[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multioutput-conformal-research"
version = "0.1.0"
description = "Modular experiments for joint conformal coverage in multi-output classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7", "Pillow>=10", "requests>=2.31", "gdown>=5,<6"]

[project.optional-dependencies]
images = ["torch>=2.2", "torchvision>=0.17"]
dev = ["ruff>=0.9"]

[project.scripts]
mocp = "mocp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
